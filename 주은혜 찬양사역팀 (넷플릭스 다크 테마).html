        const uploadToCloudinary = async (file, folder = 'grace') => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', folder);
            const res = await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                { method: 'POST', body: formData }
            );
            if (!res.ok) {

                throw new Error(err.error?.message || 'Cloudinary 업로드 실패');
            }
            const data = await res.json();
            return data.secure_url;

        const getYoutubeId = (url) => {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url?.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const compressImage = (file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                if (!file) return reject("No file provided");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onerror = () => reject(new Error("Image Load Failed")); 
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
                            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
                            canvas.width = Math.floor(width) || 100;
                            canvas.height = Math.floor(height) || 100;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch (e) {
                            reject(e);
                        }
                    };
                };
                reader.onerror = (e) => reject(e);
            });
        };

        const cropImageForOCR = (dataUrl, startYRatio = 0.0, endYRatio = 1.0) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        const startY = Math.floor(img.height * startYRatio);
                        const endY = Math.floor(img.height * endYRatio);
                        const cropHeight = Math.max(1, endY - startY);
                        canvas.width = img.width;
                        canvas.height = cropHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, startY, img.width, cropHeight, 0, 0, img.width, cropHeight);
                        resolve(canvas.toDataURL('image/jpeg', 0.9));
                    } catch(e) { reject(e); }
                };
                img.onerror = () => reject(new Error("Cropping failed"));
                img.src = dataUrl;
            });
        };

        const recognizeNamesWithGemini = async (base64Image, apiKey, onRetry) => {
            const cleanKey = apiKey ? apiKey.trim().replace(/[^a-zA-Z0-9_-]/g, '') : "";
            if (!cleanKey) throw new Error("시스템 설정 메뉴에서 발급받으신 Gemini API 키를 입력해주세요.");
            if (cleanKey.includes("AIzaSyDribbbOpi9VcnLu3szJZnT06R4dhx9eww")) throw new Error("데이터베이스 전용 키가 입력되었습니다. 구글 AI Studio에서 새로 발급받은 키를 넣어주세요.");

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
            const base64Data = base64Image.split(',')[1];
            const payload = {
                contents: [{ parts: [
                    { text: "이 이미지에서 한국어 사람 이름을 모두 찾아 추출해주세요. 이름들은 자석, 스티커, 카드, 명단 등 어떤 형태로든 표기되어 있을 수 있습니다. 규칙: 1) 한국 성명(2~4글자 한글)만 추출하세요. 2) 지명, 단어, 기호는 제외하세요. 3) 출력형식: 오직 이름만 쉼표로 구분, 다른 텍스트 없이. 예시 출력: 홍길동,김철수,이영희,박민준" },
                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                ]}],
                generationConfig: { temperature: 0.1 }
            };

            const RETRY_DELAYS = [3000, 7000, 15000];
            const MAX_ATTEMPTS = 4;

            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        const errData = await response.json();
                        const status = response.status;
                        const isBusy = status === 503 || status === 429 || (errData.error?.status === 'UNAVAILABLE') || (errData.error?.message || '').toLowerCase().includes('high demand') || (errData.error?.message || '').toLowerCase().includes('overloaded');
                        if (isBusy && attempt < MAX_ATTEMPTS - 1) {
                            const waitSec = RETRY_DELAYS[attempt] / 1000;
                            onRetry && onRetry(attempt + 1, waitSec);
                            await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt]));
                            continue;
                        }
                        throw new Error(errData.error?.message || `HTTP 에러 (${status})`);
                    }
                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("결과를 찾을 수 없습니다.");
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    if (attempt < MAX_ATTEMPTS - 1 && !(e.message?.includes('키') || e.message?.includes('API'))) {
                        const waitSec = RETRY_DELAYS[attempt] / 1000;
                        onRetry && onRetry(attempt + 1, waitSec);
                        await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt]));
                        continue;
                    }
                    throw e;
                }
            }
        };

        const PinchZoomImg = ({ src, onClose }) => {
            const [scale, setScale] = useState(1);
            const [tx, setTx] = useState(0);
            const [ty, setTy] = useState(0);
            const [gesture, setGesture] = useState({ active: false });

            const onTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const t0 = e.touches[0], t1 = e.touches[1];
                    const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    setGesture({ active: true, mode: 'pinch', startDist: d, startScale: scale, startTx: tx, startTy: ty, startMidX: (t0.clientX + t1.clientX) / 2, startMidY: (t0.clientY + t1.clientY) / 2 });
                } else if (e.touches.length === 1) {
                    const t = e.touches[0];
                    if (scale > 1.01) setGesture({ active: true, mode: 'pan', startX: t.clientX, startY: t.clientY, startTx: tx, startTy: ty });
                }
            };
            const onTouchMove = (e) => {
                if (!gesture.active) return;
                if (gesture.mode === 'pinch' && e.touches.length === 2) {
                    e.preventDefault();
                    const t0 = e.touches[0], t1 = e.touches[1];
                    const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    const factor = d / (gesture.startDist || 1);
                    setScale(Math.max(1, Math.min(gesture.startScale * factor, 6)));
                    setTx(gesture.startTx + ((t0.clientX + t1.clientX) / 2 - gesture.startMidX));
                    setTy(gesture.startTy + ((t0.clientY + t1.clientY) / 2 - gesture.startMidY));
                } else if (gesture.mode === 'pan' && e.touches.length === 1) {
                    e.preventDefault();
                    const t = e.touches[0];
                    setTx(gesture.startTx + (t.clientX - gesture.startX));
                    setTy(gesture.startTy + (t.clientY - gesture.startY));
                }
            };
            const onTouchEnd = (e) => {
                if (e.touches.length === 0) {
                    setGesture({ active: false });
                    if (scale <= 1.01) { setScale(1); setTx(0); setTy(0); }
                }
            };
            const handleReset = (e) => { e.stopPropagation(); setScale(1); setTx(0); setTy(0); };

            return (
                <div className="fixed inset-0 z-[600] bg-black/95 flex items-center justify-center fade-in overflow-hidden" style={{ touchAction: 'none' }} onClick={() => { if (scale <= 1.01) onClose(); }} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}>

                    <img src={src} draggable={false} className="max-w-full max-h-full object-contain select-none pointer-events-none" style={{ transform: `translate(${tx}px, ${ty}px) scale(${scale})`, transformOrigin: 'center center', transition: gesture.active ? 'none' : 'transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)', willChange: 'transform' }} />
                </div>

            const [isNavVisible, setIsNavVisible] = useState(true);
            const lastScrollY = useRef(0);

            const [toast, setToast] = useState({ show: false, msg: '' });
            const [authModal, setAuthModal] = useState({ isOpen: false, onConfirm: null });

            useEffect(() => {
                if (cacheGet('songs') || cacheGet('members')) setReady(true);
                const waitFirebase = setInterval(() => { 
                    if (window.FB_READY && window.MyFirebase) { clearInterval(waitFirebase); initApp(); } 
                }, 50);
                setTimeout(() => { clearInterval(waitFirebase); setReady(true); }, 5000);
            }, []);

            const initApp = async () => {
                const { auth, db, collection, onSnapshot, signInAnonymously } = window.MyFirebase;
                try {
                    await signInAnonymously(auth);
                    onSnapshot(collection(db, 'roster', 'current'), (s) => { if(s.exists()) setMembers(s.data().list); setReady(true); });
                    onSnapshot(collection(db, 'music'), (s) => {
                        const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() }));
                        list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                        setSongs(list);
                    });
                    onSnapshot(collection(db, 'videos'), (s) => {
                        const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() }));
                        setVideos(list);
                    });
                    onSnapshot(collection(db, 'history'), (s) => {
                        const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() }));
                        list.sort((a, b) => new Date(b.date.replace(/\. /g, '-').replace(/\.$/, '')) - new Date(a.date.replace(/\. /g, '-').replace(/\.$/, '')));
                        setHistory(list);
                    });
                } catch (e) { setReady(true); }
            };

            const showToast = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 3000); };
            const requestAuth = (callback) => { if (isAdmin) { callback(); } else { setAuthModal({ isOpen: true, onConfirm: callback }); } };
            const askConfirm = (title, msg, onConfirm) => {}; 

            const handleScroll = (e) => {
                const currentScrollY = e.target.scrollTop;
                if (currentScrollY <= 0) { setIsNavVisible(true); lastScrollY.current = currentScrollY; return; }
                if (currentScrollY > lastScrollY.current + 10) { setIsNavVisible(false); } 
                else if (currentScrollY < lastScrollY.current - 10) { setIsNavVisible(true); }
                lastScrollY.current = currentScrollY;
            };

            if (!ready) return <div className="h-screen flex items-center justify-center bg-black"><div className="w-8 h-8 border-3 border-[#E50914]/20 border-t-[#E50914] rounded-full animate-spin"></div></div>;

            return (
                <div className="flex h-screen bg-black overflow-hidden text-left w-full relative">
                    <main className="flex-1 flex flex-col min-h-0 overflow-hidden relative">
                        {/* Netflix Style Dark Header */}
                        <header className={`absolute top-0 left-0 right-0 glass-header px-5 h-[calc(70px+env(safe-area-inset-top))] pt-[env(safe-area-inset-top)] flex items-center justify-between shrink-0 z-30 transition-transform duration-300 ${isNavVisible ? 'translate-y-0' : '-translate-y-full'}`}>
                            <div onClick={() => setActiveTab('music')} className="flex items-center gap-2 cursor-pointer text-left">
                                <span className="font-black text-2xl text-[#E50914] tracking-tighter uppercase">Grace</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setActiveTab('manage')} className={`p-1.5 rounded-full transition-colors ${activeTab === 'manage' ? 'text-white' : 'text-neutral-500 hover:text-white'}`}><LucideIcon name="user" className="w-5 h-5" /></button>
                            </div>
                        </header>

                        <div className="flex-1 scroll-container p-0 hide-scrollbar min-h-0 w-full overflow-x-hidden text-left" onScroll={handleScroll}>
                            <div className="max-w-4xl mx-auto w-full pt-[calc(80px+env(safe-area-inset-top))] px-4 md:px-10 pb-20">
                                {activeTab === 'stats' && <StatsView history={history} members={members} onAddAttendance={() => setActiveTab('attendance')} requestAuth={requestAuth} askConfirm={askConfirm} showToast={showToast} />}
                                {activeTab === 'music' && <MusicView songs={songs} worshipSongs={worshipSongs} requestAuth={requestAuth} askConfirm={askConfirm} showToast={showToast} isAdmin={isAdmin} geminiApiKey={""} lastMusicSource={"중앙성가"} />}
                                {activeTab === 'videos' && <VideoView videos={videos} requestAuth={requestAuth} askConfirm={askConfirm} showToast={showToast} isAdmin={isAdmin} />}
                                {activeTab === 'manage' && <ManageView members={members} requestAuth={requestAuth} showToast={showToast} />}
                                {activeTab === 'attendance' && <AttendanceView members={members} onCancel={() => setActiveTab('stats')} />}
                            </div>
                        </div>

                        {/* Netflix Style Dark Bottom Tab Bar */}
                        <nav className={`fixed bottom-0 left-0 right-0 h-[calc(60px+env(safe-area-inset-bottom))] pb-[env(safe-area-inset-bottom)] glass-nav flex items-center justify-around px-2 z-50 transition-transform duration-300 ${isNavVisible ? 'translate-y-0' : 'translate-y-full'}`}>
                            <NavIconBtn id="music" icon="music" label="음원" active={activeTab === 'music'} onClick={setActiveTab} />
                            <NavIconBtn id="videos" icon="play-square" label="영상" active={activeTab === 'videos'} onClick={setActiveTab} />
                            <NavIconBtn id="stats" icon="bar-chart-2" label="출석" active={activeTab === 'stats' || activeTab === 'attendance'} onClick={setActiveTab} />
                        </nav>
                    </main>

                    {authModal.isOpen && <AuthModal correctPassword={"onnurigrace"} onClose={() => setAuthModal({ ...authModal, isOpen: false })} onConfirm={() => { setIsAdmin(true); setAuthModal({ ...authModal, isOpen: false }); authModal.onConfirm(); }} />}
                    {toast.show && <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full text-sm font-bold z-[600] shadow-xl text-center">{toast.msg}</div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
