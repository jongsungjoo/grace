        const uploadToCloudinary = async (file, folder = 'grace') => {
            const formData = new FormData();

        const getYoutubeId = (url) => {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url?.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const compressImage = (file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) => {
            return new Promise((resolve, reject) => {
                if (!file) return reject("No file provided");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onerror = () => reject(new Error("Image Load Failed")); 
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
                        else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
                        canvas.width = Math.floor(width) || 100; canvas.height = Math.floor(height) || 100;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        };

        const cropImageForOCR = (dataUrl, startYRatio = 0.0, endYRatio = 1.0) => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const startY = Math.floor(img.height * startYRatio);
                    const endY = Math.floor(img.height * endYRatio);
                    const cropHeight = Math.max(1, endY - startY);
                    canvas.width = img.width; canvas.height = cropHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, startY, img.width, cropHeight, 0, 0, img.width, cropHeight);
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.src = dataUrl;
            });
        };

        const recognizeNamesWithGemini = async (base64Image, apiKey, onRetry) => {
            const cleanKey = apiKey ? apiKey.trim().replace(/[^a-zA-Z0-9_-]/g, '') : "";
            if (!cleanKey || cleanKey.includes("AIza")) throw new Error("유효한 Gemini API 키를 입력해주세요.");

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${cleanKey}`;
            const base64Data = base64Image.split(',')[1];
            const payload = {
                contents: [{ parts: [
                    { text: "이 이미지에서 한국어 사람 이름을 모두 찾아 추출해주세요. 한국 성명(2~4글자 한글)만 쉼표로 구분하여 출력하세요." },
                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                ]}],
                generationConfig: { temperature: 0.1 }
            };

            const RETRY_DELAYS = [3000, 7000, 15000];
            for (let attempt = 0; attempt < 4; attempt++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) {
                        if (attempt < 3) { await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt])); continue; }
                        throw new Error(`HTTP 에러 (${response.status})`);
                    }
                    const data = await response.json();
                    if (!data.candidates || data.candidates.length === 0) throw new Error("결과를 찾을 수 없습니다.");
                    return data.candidates[0].content.parts[0].text;
                } catch (e) {
                    if (attempt < 3 && !e.message?.includes('API')) { await new Promise(r => setTimeout(r, RETRY_DELAYS[attempt])); continue; }
                    throw e;
                }
            }
        };

        const PinchZoomImg = ({ src, onClose }) => {
            const [scale, setScale] = useState(1);
            const [tx, setTx] = useState(0);
            const [ty, setTy] = useState(0);
            const [gesture, setGesture] = useState({ active: false });

            const onTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const t0 = e.touches[0], t1 = e.touches[1];
                    const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    setGesture({ active: true, mode: 'pinch', startDist: d, startScale: scale, startTx: tx, startTy: ty, startMidX: (t0.clientX + t1.clientX) / 2, startMidY: (t0.clientY + t1.clientY) / 2 });
                } else if (e.touches.length === 1) {
                    const t = e.touches[0];
                    if (scale > 1.01) setGesture({ active: true, mode: 'pan', startX: t.clientX, startY: t.clientY, startTx: tx, startTy: ty });
                }
            };
            const onTouchMove = (e) => {
                if (!gesture.active) return;
                if (gesture.mode === 'pinch' && e.touches.length === 2) {
                    e.preventDefault();
                    const t0 = e.touches[0], t1 = e.touches[1];
                    const d = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
                    const factor = d / (gesture.startDist || 1);
                    setScale(Math.max(1, Math.min(gesture.startScale * factor, 6)));
                    setTx(gesture.startTx + ((t0.clientX + t1.clientX) / 2 - gesture.startMidX));
                    setTy(gesture.startTy + ((t0.clientY + t1.clientY) / 2 - gesture.startMidY));
                } else if (gesture.mode === 'pan' && e.touches.length === 1) {
                    e.preventDefault();
                    const t = e.touches[0];
                    setTx(gesture.startTx + (t.clientX - gesture.startX)); setTy(gesture.startTy + (t.clientY - gesture.startY));
                }
            };
            const onTouchEnd = (e) => { if (e.touches.length === 0) { setGesture({ active: false }); if (scale <= 1.01) { setScale(1); setTx(0); setTy(0); } } };

            return (
                <div className="fixed inset-0 z-[400] bg-black/95 flex items-center justify-center fade-in overflow-hidden" style={{ touchAction: 'none' }} onClick={() => { if (scale <= 1.01) onClose(); }} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}>
                    <button onClick={(e) => { e.stopPropagation(); onClose(); }} className="absolute top-6 right-6 text-white/80 hover:text-white p-3 rounded-full bg-white/10 backdrop-blur-md transition-all active:scale-90 z-[310]"><LucideIcon name="x" className="w-8 h-8" /></button>
                    {scale > 1.05 && (
                        <button onClick={(e) => { e.stopPropagation(); setScale(1); setTx(0); setTy(0); }} className="absolute top-6 left-6 text-white/80 hover:text-white px-4 py-2 rounded-full bg-white/10 backdrop-blur-md transition-all active:scale-90 z-[310] text-xs font-bold flex items-center gap-1.5"><LucideIcon name="minimize-2" className="w-4 h-4" /><span>원본</span></button>
                    )}
                    <img src={src} draggable={false} className="max-w-full max-h-full object-contain rounded-lg shadow-2xl select-none pointer-events-none" style={{ transform: `translate(${tx}px, ${ty}px) scale(${scale})`, transformOrigin: 'center center', transition: gesture.active ? 'none' : 'transform 0.2s cubic-bezier(0.16, 1, 0.3, 1)', willChange: 'transform' }} />
                </div>
            );
        };

        const HistoryDetailModal = ({ record, allMembers, onClose, onSave, onDelete, requestAuth, showToast, geminiApiKey, onSelectMember }) => {
            const [selected, setSelected] = useState(new Set(record.members || []));
            const [image, setImage] = useState(record.image || null);
            const initialDate = record.date.replace(/\. /g, '-').replace(/\.$/, '');
            const [date, setDate] = useState(initialDate);
            const [isEditable, setIsEditable] = useState(false);
            const [ocrStatus, setOcrStatus] = useState("idle");
            const [ocrProgress, setOcrProgress] = useState(0);
            const [isFullScreen, setIsFullScreen] = useState(false);
            const [imageFile, setImageFile] = useState(null);
            
            const activeMembers = (allMembers || []).filter(m => m && (m.status === 'active' || selected.has(m.name)));

            const handleImageUpload = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                try {
                    const compressed = await compressImage(file);
                    setImage(compressed); setImageFile(file);
                } catch (err) { showToast("이미지 업로드 실패"); }

            const handleRunAI = async () => {
                if (!image) return showToast("사진을 업로드해주세요.");
                setOcrStatus("processing"); setOcrProgress(30);
                try {
                    const cropped = await cropImageForOCR(image, 0.0, 1.0);
                    setOcrProgress(50);
                    const extractedText = await recognizeNamesWithGemini(cropped, geminiApiKey, (a, w) => { setOcrProgress(20); showToast(`혼잡 — ${w}초 후 재시도 (${a}/3)`); });
                    setOcrProgress(100);
                    const cleanText = extractedText.replace(/\s+/g, '');
                    const next = new Set(selected);
                    allMembers.forEach(m => { if (m?.name && cleanText.includes(m.name)) next.add(m.name); });
                    setSelected(next); setOcrStatus("success"); showToast("인식 완료!");
                } catch (err) {
                    setOcrStatus("idle"); showToast("인식 실패: " + err.message);

                                ) : (

                                {!isEditable && <button onClick={() => requestAuth(() => setIsEditable(true))} className="p-2 bg-white/5 text-white rounded-full hover:bg-white/10"><LucideIcon name="edit-3" className="w-5 h-5" /></button>}
                                <button onClick={onClose} className="p-2 bg-white/5 text-neutral-400 hover:text-white rounded-full"><LucideIcon name="x" className="w-5 h-5" /></button>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto p-6 hide-scrollbar">
                            <div className="space-y-6">
                                <section>
                                    {isEditable && (
                                        <div className="flex flex-col mb-4">
                                            <button onClick={handleRunAI} disabled={ocrStatus === 'processing' || !image} className="w-full bg-[#E50914] text-white py-3 px-4 rounded-xl font-bold transition-transform active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50 text-sm">
                                                {ocrStatus === 'processing' ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <LucideIcon name="sparkles" className="w-4 h-4" />}
                                                {ocrStatus === 'processing' ? "AI 이름 인식 중..." : "AI 자동 출석 체크"}
                                            </button>
                                        </div>
                                    )}
                                    <div className={`relative bg-black rounded-xl border border-white/10 overflow-hidden min-h-[180px] flex items-center justify-center transition-all ${isEditable ? 'cursor-pointer hover:border-white/30' : ''}`}>
                                        {image ? (
                                            <div className={`w-full relative group ${!isEditable ? 'cursor-zoom-in' : ''}`} onClick={() => !isEditable && setIsFullScreen(true)}>
                                                <img src={image} className="w-full max-h-[35vh] md:max-h-[40vh] object-contain" />
                                                {ocrStatus === "processing" && (
                                                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center p-4">
                                                        <div className="w-full bg-white/10 h-1.5 rounded-full mb-2 max-w-[150px]"><div className="bg-[#E50914] h-full progress-bar-fill rounded-full" style={{ width: `${ocrProgress}%` }}></div></div>
                                                        <p className="text-[#E50914] font-bold text-xs animate-pulse">인식 중 {ocrProgress}%</p>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="text-center p-4 text-neutral-600">
                                                <LucideIcon name="image" className="w-10 h-10 mx-auto mb-2 opacity-50" />
                                                <p className="text-xs font-semibold">{isEditable ? "영역을 눌러 사진 업로드" : "사진이 없습니다."}</p>
                                            </div>
                                        )}
                                        {isEditable && <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleImageUpload} disabled={ocrStatus === 'processing'} />}
                                    </div>
                                </section>
                                <section>
                                    <h4 className="text-xs font-bold text-neutral-400 mb-4 uppercase tracking-wider">참석 팀원 명단 ({selected.size}명)</h4>
                                    {['staff', ...PARTS.map(p=>p.id)].map(partId => {
                                        const list = activeMembers.filter(m => m.part === partId);
                                        if (list.length === 0) return null;
                                        
                                        const checkedCount = list.filter(m => selected.has(m.name)).length;
                                        const partObj = PARTS.find(p => p.id === partId);
                                        const partColor = partId === 'staff' ? '#fff' : (partObj ? partObj.color : '#ccc');
                                        const partNameLabel = partId === 'staff' ? '성가사 · 반주자' : (partObj ? partObj.name : '');
                                        
                                        return (
                                            <div key={partId} className="mb-6 text-left">
                                                <h5 className="flex items-center gap-2 mb-3">
                                                    <span className="w-1.5 h-4 rounded-full shrink-0" style={{backgroundColor: partColor}}></span>
                                                    <span className="text-sm font-bold text-white">{partNameLabel}</span>
                                                    <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-white/10" style={{color: partColor}}>{checkedCount}/{list.length}</span>
                                                </h5>
                                                <div className="grid grid-cols-4 gap-2">
                                                    {list.map(m => {
                                                        const checked = selected.has(m.name);
                                                        return (
                                                            <button key={m.name}
                                                                onClick={() => {
                                                                    if (isEditable) {
                                                                        const n = new Set(selected);
                                                                        if(n.has(m.name)) n.delete(m.name); else n.add(m.name);
                                                                        setSelected(n);
                                                                    } else { onSelectMember && onSelectMember(m.name); }
                                                                }}
                                                                className={`px-2 py-2.5 rounded-xl border transition-all duration-200 active:scale-95 flex flex-col items-center justify-center gap-1 ${checked ? 'bg-white/10 border-white/20' : 'bg-black border-white/5'}`}
                                                                style={{ minHeight: '44px' }}
                                                            >
                                                                <span className={`text-xs font-bold whitespace-nowrap ${checked ? 'text-white' : 'text-neutral-500'}`}>{m.name}</span>

                        {isEditable && <footer className="flex gap-2 p-6 border-t border-white/10 shrink-0 bg-black/50 backdrop-blur-md">

                            <button onClick={async () => {

                                onSave({...record, date: date.replace(/-/g, '. ') + '.', members: Array.from(selected), count: selected.size, image: finalImage});
                            }} className="flex-[2] bg-[#E50914] text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-transform text-sm">저장</button>
                        </footer>}
                    </div>
                    {isFullScreen && image && <PinchZoomImg src={image} onClose={() => setIsFullScreen(false)} />}
                </div>
            );
        };

        const LUNAR_YEAR_DATA = { 2025: { newYear:[1,29], months:[30,29,30,29,30,29,30,29,30,30,30,29], leap:6, leapDays:29 }, 2026: { newYear:[2,17], months:[29,30,29,30,29,30,29,30,29,30,30,29], leap:0, leapDays:0 }, 2027: { newYear:[2,6], months:[30,29,30,29,30,29,30,29,30,29,30,29], leap:0, leapDays:0 } };
        const lunarToSolar = (solarYear, lunarMonth, lunarDay) => {
            const data = LUNAR_YEAR_DATA[solarYear]; if (!data) return null;
            const [nyMM, nyDD] = data.newYear; const { months, leap, leapDays } = data;
            const fullMonths = [];
            for (let m = 1; m <= 12; m++) {
                fullMonths.push({ m, isLeap: false, days: months[m - 1] });
                if (leap > 0 && m === leap) fullMonths.push({ m, isLeap: true, days: leapDays });
            }
            let offset = 0, found = false;
            for (const fm of fullMonths) {
                if (fm.m === lunarMonth && !fm.isLeap) { offset += lunarDay - 1; found = true; break; }
                offset += fm.days;
            }
            if (!found) return null;
            const base = new Date(solarYear, nyMM - 1, nyDD);
            base.setDate(base.getDate() + offset);
            return { year: base.getFullYear(), month: base.getMonth() + 1, day: base.getDate() };
        };

        const MemberChipAttended = ({ name, partMap, partOverride, roleOverride, onClick }) => {
            const part = partOverride || (partMap ? partMap[name] : null);
            let pi = PART_ICON[part] || null;
            if (part === 'staff' && pi) pi = { ...pi, abbr: roleOverride === '반주자' ? '반' : '성' };
            const Tag = onClick ? 'button' : 'div';
            return (
                <Tag onClick={onClick} className={`flex flex-col items-center justify-center gap-1.5 px-1 py-2.5 bg-black border border-white/10 rounded-xl ${onClick ? 'active:scale-95 hover:bg-white/5 transition-all cursor-pointer w-full' : 'w-full'}`} style={{minHeight:'64px'}}>
                    {pi && <span className="inline-flex items-center justify-center w-5 h-5 rounded font-bold shrink-0" style={{backgroundColor:pi.light, color:pi.color, fontSize:'10px'}}>{pi.abbr}</span>}
                    <span className="font-bold text-xs text-white whitespace-nowrap leading-tight">{name}</span>
                </Tag>
            );
        };

        const BirthdayCalendarModal = ({ members, onClose }) => {
            const today = new Date();
            const [calYear, setCalYear] = useState(today.getFullYear());
            const [calMonth, setCalMonth] = useState(today.getMonth() + 1);

            const prevMonth = () => { if (calMonth === 1) { setCalYear(y=>y-1); setCalMonth(12); } else setCalMonth(m=>m-1); };
            const nextMonth = () => { if (calMonth === 12) { setCalYear(y=>y+1); setCalMonth(1); } else setCalMonth(m=>m+1); };

            const bdMap = useMemo(() => {
                const map = {};
                (members || []).filter(m => m.status !== 'sabbatical' && m.status !== 'inactive').forEach(m => {
                    if (!m.birthday) return;
                    const [mm, dd] = m.birthday.split('-').map(Number);
                    if (!mm || !dd) return;
                    let displayMM = mm, displayDD = dd;
                    let lunarMM = null, lunarDD = null;
                    if (m.birthdayType === 'lunar') {
                        lunarMM = mm; lunarDD = dd;
                        let solar = lunarToSolar(calYear, mm, dd);
                        if (!solar || solar.year !== calYear) solar = lunarToSolar(calYear - 1, mm, dd);
                        if (solar && solar.year === calYear) { displayMM = solar.month; displayDD = solar.day; } else return;
                    }
                    if (displayMM === calMonth) {
                        if (!map[displayDD]) map[displayDD] = [];
                        map[displayDD].push({ name: m.name, part: m.part || 'staff', role: m.role || '', lunar: m.birthdayType === 'lunar', lunarMM, lunarDD, solarDD: displayDD });
                    }
                });
                return map;
            }, [members, calMonth, calYear]);

            const firstDay = new Date(calYear, calMonth - 1, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth, 0).getDate();
            const cells = Array.from({length: firstDay}, () => null).concat(Array.from({length: daysInMonth}, (_,i) => i+1));
            const isCurrentMonth = calYear === today.getFullYear() && calMonth === today.getMonth()+1;
            const todayD = today.getDate();

            const bdList = Object.entries(bdMap).sort((a,b) => Number(a[0]) - Number(b[0])).flatMap(([d, bds]) => bds.map(b => ({ ...b, displayD: Number(d) })));

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[200] flex items-end md:items-center justify-center p-0 md:p-4 text-left">
                    <div className="bg-[#141414] border border-white/10 w-full md:max-w-2xl rounded-t-[24px] md:rounded-[24px] shadow-2xl scale-in flex flex-col min-h-[65vh] max-h-[90vh] overflow-hidden">
                        <div className="flex items-center justify-between px-6 py-4 border-b border-white/10 shrink-0">
                            <div>
                                <h3 className="text-lg font-bold text-white">생일 달력</h3>
                                <p className="text-xs text-neutral-400 font-medium mt-0.5">팀원 생일 현황</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full bg-white/5 text-neutral-400 hover:text-white transition-colors active:scale-90">
                                <LucideIcon name="x" className="w-4 h-4" />
                            </button>
                        </div>
                        <div className="overflow-y-auto hide-scrollbar flex-1 px-5 pb-6">
                            <div className="flex items-center justify-between py-5">
                                <button onClick={prevMonth} className="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-white hover:bg-white/10 active:scale-90 transition-all"><LucideIcon name="chevron-left" className="w-5 h-5" /></button>
                                <p className="font-bold text-white text-xl">{calYear}년 {calMonth}월</p>
                                <button onClick={nextMonth} className="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-white hover:bg-white/10 active:scale-90 transition-all"><LucideIcon name="chevron-right" className="w-5 h-5" /></button>
                            </div>
                            <div className="grid grid-cols-7 mb-2">
                                {['일','월','화','수','목','금','토'].map((d,i) => (
                                    <div key={d} className={`text-center text-xs font-bold pb-2 ${i===0?'text-[#E50914]':i===6?'text-blue-400':'text-neutral-500'}`}>{d}</div>
                                ))}
                            </div>
                            <div className="grid grid-cols-7 gap-1.5">
                                {cells.map((day, idx) => {
                                    if (!day) return <div key={`e${idx}`} className="min-h-[64px]" />;
                                    const bds = bdMap[day] || [];
                                    const isTodayCell = isCurrentMonth && day === todayD;
                                    const dow = (firstDay + day - 1) % 7;
                                    return (
                                        <div key={day} className={`flex flex-col items-center px-0 py-1.5 rounded-xl min-h-[64px] transition-all ${bds.length > 0 ? 'bg-white/5 border border-white/10' : 'border border-transparent'} ${isTodayCell ? 'ring-1 ring-white/50' : ''}`}>
                                            <span className={`text-[13px] font-bold leading-none mb-1 ${isTodayCell?'text-white':dow===0?'text-[#E50914]':dow===6?'text-blue-400':'text-neutral-400'}`}>{day}</span>
                                            {bds.length > 0 && <span className="text-xs leading-none mb-1">🎁</span>}
                                            <div className="flex flex-col items-center gap-0.5 w-full px-1">
                                                {bds.map((b, bi) => <span key={bi} className="text-[9px] font-semibold text-white leading-tight truncate w-full text-center">{b.name}</span>)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            {bdList.length > 0 ? (

                    onSnapshot(doc(db, 'settings', 'admin'), (s) => { if (s.exists()) { setMasterPassword(s.data().password||""); setDeletePassword(s.data().deletePassword||""); setGeminiApiKey(s.data().geminiKey||""); setLastMusicSource(s.data().lastMusicSource||""); } });
                    onSnapshot(doc(db, 'roster', 'current'), (s) => { if (s.exists()) { setMembers(s.data().list); } });
                    onSnapshot(collection(db, 'history'), (s) => { const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() })); list.sort((a, b) => new Date(b.date.replace(/\. /g, '-').replace(/\.$/, '')) - new Date(a.date.replace(/\. /g, '-').replace(/\.$/, ''))); setHistory(list); });
                    onSnapshot(collection(db, 'music'), (s) => { const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() })); list.sort((a, b) => (b.date || "").localeCompare(a.date || "")); setSongs(list); });
                    onSnapshot(collection(db, 'worshipSongs'), (s) => { const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() })); list.sort((a, b) => (a.order || 0) - (b.order || 0)); setWorshipSongs(list); });
                    onSnapshot(collection(db, 'videos'), (s) => { const list = []; s.forEach(d => list.push({ id: d.id, ...d.data() })); list.sort((a, b) => (b.date||'').localeCompare(a.date||'')); setVideos(list); });
                };
                setReady(true);
                try {
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { if (u) attach(); });
                } catch (e) {}
            };

            const showToast = (msg) => { setToast({ show: true, msg }); setTimeout(() => setToast({ show: false, msg: '' }), 3000); };
            const requestAuth = (callback) => { if (isAdmin) { callback(); } else { setAuthModal({ isOpen: true, onConfirm: callback }); } };
            const askConfirm = (title, msg, onConfirm) => setConfirmModal({ isOpen: true, title, msg, onConfirm });

            const handleScroll = (e) => {
                const currentScrollY = e.target.scrollTop;
                if (currentScrollY <= 0) { setIsNavVisible(true); lastScrollY.current = currentScrollY; return; }
                if (currentScrollY > lastScrollY.current + 10) setIsNavVisible(false);
                else if (currentScrollY < lastScrollY.current - 10) setIsNavVisible(true);
                lastScrollY.current = currentScrollY;
            };

            const sortedMembers = useMemo(() => {
                return [...members].sort((a, b) => {
                    if (a.name === "박용규") return -1; if (b.name === "박용규") return 1;
                    return (a.name||"").localeCompare(b.name||"", 'ko');
                });
            }, [members]);
            
            const handleSaveMember = async (form, originalName) => {
                const { db, doc, setDoc, getDoc } = window.MyFirebase;
                const data = { name: form.name.trim(), part: form.part, status: form.status, role: form.role.trim(), birthday: form.birthday.trim(), birthdayType: form.birthdayType || 'solar', photo: form.photo || null };
                const snap = await getDoc(doc(db, 'roster', 'current'));
                const latest = snap.exists() ? (snap.data().list || []) : [];
                const newList = originalName && latest.some(m => m.name === originalName) ? latest.map(m => m.name === originalName ? { ...m, ...data } : m) : [...latest, data];
                await setDoc(doc(db, 'roster', 'current'), { list: newList });
                showToast(originalName ? "수정되었습니다." : "팀원이 추가되었습니다.");
                setEditMemberConfig(null);
            };
            
            const handleDeleteMember = async (name) => {
                askConfirm("팀원 삭제", "정말 삭제하시겠습니까?", async () => {
                    const { db, doc, setDoc } = window.MyFirebase;
                    const newList = members.filter(m => m.name !== name);
                    await setDoc(doc(db, 'roster', 'current'), { list: newList });
                    showToast("삭제되었습니다."); setEditMemberConfig(null);
                });
            };

            if (!ready) return <div className="h-screen flex items-center justify-center bg-black"><div className="w-10 h-10 border-4 border-white/10 border-t-[#E50914] rounded-full animate-spin"></div></div>;

            return (
                <div className="flex h-screen bg-[#000] overflow-hidden text-left w-full">
                    <aside className="hidden md:flex flex-col w-64 bg-[#141414] border-r border-white/10 p-6 z-10 shrink-0 text-left">
                        <div className="mb-10 flex items-center gap-3 text-left">
                            <AppLogo className="w-10 h-10" />
                            <div className="text-left min-w-0">
                                <h1 onClick={() => setActiveTab('music')} className="text-lg font-black text-[#E50914] tracking-tight cursor-pointer">주은혜 찬양사역팀</h1>
                                <div className="text-[10px] mt-0.5 text-neutral-500 font-bold uppercase tracking-widest flex items-center gap-1"><span className={`w-2 h-2 rounded-full ${isAdmin ? 'bg-blue-500 animate-pulse' : 'bg-green-500'}`}></span> {isAdmin ? '관리자 모드' : '온라인'}</div>
                            </div>
                        </div>
                        <nav className="flex-1 space-y-2 text-left">
                            <NavBtn id="music" label="성가음원" icon="music-2" active={activeTab === 'music'} onClick={setActiveTab} />
                            <NavBtn id="videos" label="찬양영상" icon="play-circle" active={activeTab === 'videos'} onClick={setActiveTab} />
                            <NavBtn id="stats" label="출석현황" icon="bar-chart-2" active={activeTab === 'stats' || activeTab === 'attendance'} onClick={setActiveTab} />
                            <div className="pt-6 pb-2 text-[10px] font-black text-neutral-600 uppercase tracking-widest px-4 text-left">매니저 영역</div>
                            <NavBtn id="manage" label="찬양팀명단" icon="user-round" active={activeTab === 'manage'} onClick={setActiveTab} />
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col min-h-0 overflow-hidden relative bg-[#000] text-left">
                        <header className={`md:hidden absolute top-0 left-0 right-0 glass-header px-5 h-[calc(60px+env(safe-area-inset-top))] pt-[env(safe-area-inset-top)] flex items-center justify-between shrink-0 z-30 transition-transform duration-300 ${isNavVisible ? 'translate-y-0' : '-translate-y-full'}`}>
                            <div onClick={() => setActiveTab('music')} className="flex items-center gap-3 cursor-pointer">
                                <AppLogo className="w-8 h-8" />
                                <span className="font-black text-lg text-white tracking-tight">주은혜 찬양사역팀</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setActiveTab('manage')} className={`p-2 rounded-full transition-transform active:scale-90 ${activeTab === 'manage' ? 'text-white bg-white/10' : 'text-neutral-400'}`}><LucideIcon name="user-round" className="w-5 h-5" /></button>
                            </div>
                        </header>

                        <div className="flex-1 scroll-container p-4 pt-[calc(80px+env(safe-area-inset-top))] md:p-10 pb-32 md:pb-10 hide-scrollbar min-h-0 w-full overflow-x-hidden text-left" onScroll={handleScroll}>
                            <div className="max-w-4xl mx-auto w-full text-left">
                                {activeTab === 'stats' && <StatsView history={history} members={sortedMembers} onAddAttendance={() => requestAuth(() => setActiveTab('attendance'))} onOpenInterest={() => setShowInterestModal(true)} onOpenBdCalendar={() => setShowBdCalendar(true)} onOpenAttendStats={() => setShowAttendStats(true)} onOpenPersonal={() => setShowPersonalModal(true)} onDetail={(h) => setEditingHistory(h)} />}
                                {activeTab === 'music' && <MusicView songs={songs} worshipSongs={worshipSongs} requestAuth={requestAuth} askConfirm={askConfirm} showToast={showToast} isAdmin={isAdmin} geminiApiKey={geminiApiKey} lastMusicSource={lastMusicSource} />}
                                {activeTab === 'videos' && <VideoView videos={videos} requestAuth={requestAuth} askConfirm={askConfirm} showToast={showToast} isAdmin={isAdmin} />}
                                {activeTab === 'manage' && <ManageView members={sortedMembers} isAdmin={isAdmin} requestAuth={requestAuth} onOpenBdCalendar={() => setShowBdCalendar(true)} onOpenEditModal={(m) => requestAuth(() => setEditMemberConfig({ member: m }))} />}
                                {activeTab === 'attendance' && <AttendanceView members={sortedMembers} onCancel={() => setActiveTab('stats')} requestAuth={requestAuth} showToast={showToast} geminiApiKey={geminiApiKey} />}
                            </div>
                        </div>

                        <nav className={`md:hidden fixed bottom-0 left-0 right-0 h-[calc(60px+env(safe-area-inset-bottom))] pb-[env(safe-area-inset-bottom)] glass-nav flex items-center justify-around px-2 z-50 transition-transform duration-300 ${isNavVisible ? 'translate-y-0' : 'translate-y-full'}`}>
                            <NavIconBtn id="music" icon="music-2" label="음원" active={activeTab === 'music'} onClick={setActiveTab} />
                            <NavIconBtn id="videos" icon="play-circle" label="영상" active={activeTab === 'videos'} onClick={setActiveTab} />
                            <NavIconBtn id="stats" icon="bar-chart-2" label="출석" active={activeTab === 'stats' || activeTab === 'attendance'} onClick={setActiveTab} />
                        </nav>
                    </main>

                    {showInterestModal && <InterestModal members={sortedMembers} history={history} onClose={() => setShowInterestModal(false)} />}
                    {showBdCalendar && <BirthdayCalendarModal members={sortedMembers} onClose={() => setShowBdCalendar(false)} />}
                    {showAttendStats && <AttendStatsModal history={history} members={sortedMembers} memberPartMap={sortedMembers.reduce((a,m)=>{if(m.name)a[m.name]=m.part;return a;},{})} onClose={() => setShowAttendStats(false)} onSelectMember={(name) => { setPersonalInitialMember(name); setShowPersonalModal(true); }} />}
                    {showPersonalModal && <PersonalAttendModal history={history} members={sortedMembers} initialMember={personalInitialMember} onClose={() => { setShowPersonalModal(false); setPersonalInitialMember(null); }} />}
                    {editMemberConfig && <MemberEditModal member={editMemberConfig.member} onClose={() => setEditMemberConfig(null)} onSave={(f) => handleSaveMember(f, editMemberConfig.member?.name)} onDelete={() => handleDeleteMember(editMemberConfig.member.name)} />}
                    {editingHistory && <HistoryDetailModal record={editingHistory} allMembers={sortedMembers} requestAuth={requestAuth} onClose={() => setEditingHistory(null)} geminiApiKey={geminiApiKey} onSelectMember={(name) => { setPersonalInitialMember(name); setShowPersonalModal(true); }} onSave={async (updated) => { 
                        await window.MyFirebase.setDoc(window.MyFirebase.doc(window.MyFirebase.db, 'history', updated.id), updated);
                        showToast("수정되었습니다."); setEditingHistory(null);
                    }} onDelete={(id) => {
                        askConfirm("기록 삭제", "정말 삭제하시겠습니까?", async () => {
                            await window.MyFirebase.deleteDoc(window.MyFirebase.doc(window.MyFirebase.db, 'history', id)); showToast("삭제되었습니다."); setEditingHistory(null);
                        });
                    }} showToast={showToast} />}
                    {authModal.isOpen && <AuthModal correctPassword={masterPassword} onClose={() => setAuthModal({ ...authModal, isOpen: false })} onConfirm={() => { setIsAdmin(true); setAuthModal({ ...authModal, isOpen: false }); authModal.onConfirm(); }} />}
                    {confirmModal.isOpen && <ConfirmModal modal={confirmModal} onClose={() => setConfirmModal({ ...confirmModal, isOpen: false })} />}
                    {toast.show && <div className="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 bg-white text-black px-6 py-3 rounded-full text-sm font-bold z-[600] shadow-xl text-center fade-in">{toast.msg}</div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
